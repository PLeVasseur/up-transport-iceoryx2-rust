[package]
name = "up-transport-iceoryx2-rust"
version = "0.2.0"
edition = "2024"
description = "iceoryx2 zero-copy transport for native Eclipse uProtocol frames"
keywords = ["uProtocol", "SDK", "communication", "iceoryx", "iceoryx2"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-transport-iceoryx2-rust"

[dependencies]
up-rust = { path = "/home/pete.levasseur/eclipse/uprotocol/up-rust" }
async-trait = "0.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
iceoryx2 = "0.9.0"
iceoryx2-bb-container = "0.9.0"
hostname = "0.4.1"

[dev-dependencies]
protobuf = { version = "3.7.2", features = ["with-bytes"] }
up-rust = { path = "/home/pete.levasseur/eclipse/uprotocol/up-rust", features = ["protobuf-wire", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
