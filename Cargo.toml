[package]
name = "up-transport-iceoryx2-rust"
version = "0.1.0"
edition = "2024"

[features]
default = []
benchmark-owned = ["up-rust/owned-frame-transport"]

[dependencies]
up-rust = { git = "ssh://git@github.com/PLeVasseur/up-rust.git", rev = "26d70ef45af61fdd17d3e130845a5be155154b2e", default-features = false }
iceoryx2 = "0.9.1"
iceoryx2-bb-container = "0.9.1"
async-trait = "0.1"
hostname = "0.4.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
bytes = "1.10.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync"] }
up-wire-xcdrv2 = { git = "ssh://git@github.com/PLeVasseur/up-wire-xcdrv2-rust.git", rev = "4092ba75e24f4f96b7088f37016c78ac75aa5c05" }

[[test]]
name = "iceoryx2_owned_wire"
required-features = ["benchmark-owned"]
