[package]
name = "up-transport-iceoryx2-rust"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "iceoryx2 zero-copy transport for native Eclipse uProtocol frames"
keywords = ["uProtocol", "SDK", "communication", "iceoryx", "iceoryx2"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-transport-iceoryx2-rust"

[dependencies]
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "6db506f0deff5de4f1093d1378d7dd40d3bb9f5d" }
async-trait = "0.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
iceoryx2 = "0.9.0"
iceoryx2-bb-container = "0.9.0"
hostname = "0.4.1"

[dev-dependencies]
protobuf = { version = "3.7.2", features = ["with-bytes"] }
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "6db506f0deff5de4f1093d1378d7dd40d3bb9f5d", features = ["protobuf-wire", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
unused_unsafe = "deny"
deprecated_safe_2024 = "deny"
ffi_unwind_calls = "deny"
static_mut_refs = "deny"
clashing_extern_declarations = "deny"

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
borrow_as_ptr = "deny"
ptr_as_ptr = "deny"
as_ptr_cast_mut = "deny"
as_pointer_underscore = "deny"
not_unsafe_ptr_arg_deref = "deny"
transmute_ptr_to_ptr = "deny"
transmute_ptr_to_ref = "deny"
