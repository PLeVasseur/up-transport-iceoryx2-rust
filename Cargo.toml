[package]
name = "up-transport-iceoryx2-rust"
version = "0.1.0"
edition = "2024"

[features]
default = []
benchmark-owned = ["up-rust/owned-frame-transport"]
payload-contract-benchmarks = ["up-rust/payload-contract-fixtures"]
payload-contract-large-benchmarks = [
    "payload-contract-benchmarks",
    "up-rust/payload-contract-large-fixtures",
]
perf-diagnostics = [
    "benchmark-owned",
    "payload-contract-large-benchmarks",
    "up-rust/perf-diagnostics",
    "zero-copy",
]
zero-copy = []

[[bench]]
name = "transport_criterion"
harness = false
required-features = ["payload-contract-benchmarks"]

[dependencies]
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "14331c5efc704487a6e1abb20cb8c129207885da", default-features = false, features = ["protobuf-wire", "selected-wire-user-api", "transport-implementer-api", "wire-implementer-api", "zero-copy-transport"] }
iceoryx2 = "0.9.2"
iceoryx2-bb-container = "0.9.2"
iceoryx2-bb-system-types = "0.9.2"
async-trait = "0.1"
bytes = "1.10.1"
hostname = "0.4.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["csv_output"] }
protobuf = "3.7.2"
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync"] }
up-wire-xcdrv2 = { git = "https://github.com/PLeVasseur/up-wire-xcdrv2-rust.git", rev = "27942d8e9f3a119ab6f51aa1ee01c7872f841dd7" }

[[test]]
name = "iceoryx2_owned_wire"
required-features = ["benchmark-owned"]
