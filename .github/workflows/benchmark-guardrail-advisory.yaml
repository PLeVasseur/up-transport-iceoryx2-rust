name: Benchmark Guardrail Advisory

on:
  pull_request:
    paths:
      - "benches/**"
      - "scripts/bench_transport_criterion.sh"
      - "Cargo.*"
      - ".github/workflows/benchmark-guardrail-advisory.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always
  TRANSPORT_BENCH_PROFILE: core
  CRITERION_ARGS: --sample-size 10 --warm-up-time 1 --measurement-time 2 --noise-threshold 0.05

jobs:
  iceoryx2-transport-benchmark-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Compile transport benchmark
        run: cargo bench --features benchmark-owned --bench transport_criterion --no-run
      - name: Run advisory smoke benchmark
        run: scripts/bench_transport_criterion.sh candidate ci_smoke_iceoryx2
      - name: Export advisory artifacts
        if: always()
        run: scripts/bench_transport_criterion.sh export
      - name: Upload advisory artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iceoryx2-transport-benchmark-advisory
          path: target/transport-perf/iceoryx2
          if-no-files-found: warn
