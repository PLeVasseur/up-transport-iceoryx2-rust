[package]
name = "up-transport-iceoryx2-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Experimental iceoryx2 binding for the uProtocol two-mode core API"
readme = "README.md"

[dependencies]
up-rust-core = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "08c0a83e174afea6b227e74c9dfaadf8b0828258" }
iceoryx2 = "=0.9.2"
iceoryx2-bb-posix = "=0.9.2"
iceoryx2-bb-system-types = "=0.9.2"
hostname = "0.4.1"
# Concrete native sizing types; these are already in the resolved graph.
iceoryx2-bb-concurrency = "=0.9.3"
iceoryx2-bb-lock-free = "=0.9.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
