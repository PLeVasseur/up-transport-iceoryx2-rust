[package]
name = "up-transport-iceoryx2-rust"
version = "0.1.0"
edition = "2024"
keywords = ["uProtocol", "SDK", "communication", "iceoryx", "iceoryx2"]

[features]
default = []
zero-copy = []
benchmark-owned = ["up-rust/owned-frame-transport"]
payload-contract-benchmarks = ["up-rust/payload-contract-fixtures"]
payload-contract-large-benchmarks = [
    "payload-contract-benchmarks",
    "up-rust/payload-contract-large-fixtures",
]

[[bench]]
name = "transport_criterion"
harness = false

[dependencies]
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "0ad33e8a8508dd7c189780e0ac51095ece8995aa", default-features = false }
async-trait = "0.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
iceoryx2 = "0.9.1"
iceoryx2-bb-container = "0.9.1"
hostname = "0.4.1"
protobuf = "3.7.2"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["csv_output"] }
